<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="70" y="42" font-size="23" font-weight="700" fill="#1a1a1a">Every government churns at about the same rate</text>
  <text x="70" y="66" font-size="14" fill="#666">Amendments to Acts by parliamentary term, 2008&#8211;2026</text>

  <!-- Legend -->
  <rect x="612" y="30" width="14" height="14" rx="2" fill="#1f6fb2"/>
  <text x="632" y="42" font-size="13" fill="#444">National</text>
  <rect x="712" y="30" width="14" height="14" rx="2" fill="#cc2b2b"/>
  <text x="732" y="42" font-size="13" fill="#444">Labour</text>

  <!-- Gridlines + y labels -->
  <line x1="70" y1="430" x2="820" y2="430" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="70" y1="335.6" x2="820" y2="335.6" stroke="#ececec" stroke-width="1"/>
  <line x1="70" y1="241.1" x2="820" y2="241.1" stroke="#ececec" stroke-width="1"/>
  <line x1="70" y1="146.7" x2="820" y2="146.7" stroke="#ececec" stroke-width="1"/>
  <text x="60" y="434" text-anchor="end" font-size="12" fill="#999">0</text>
  <text x="60" y="339.6" text-anchor="end" font-size="12" fill="#999">5,000</text>
  <text x="60" y="245.1" text-anchor="end" font-size="12" fill="#999">10,000</text>
  <text x="60" y="150.7" text-anchor="end" font-size="12" fill="#999">15,000</text>

  <!-- Bars: Key x3 (Nat), Ardern x2 (Lab), Luxon (Nat, partial) -->
  <!-- Key 2008-11: 13,426 -->
  <rect x="93.5"  y="176.4" width="78" height="253.6" rx="2" fill="#1f6fb2"/>
  <text x="132.5" y="168.4" text-anchor="middle" font-size="14" font-weight="600" fill="#333">13,426</text>
  <text x="132.5" y="452" text-anchor="middle" font-size="13" fill="#333">Key</text>
  <text x="132.5" y="470" text-anchor="middle" font-size="12" fill="#888">2008&#8211;11</text>

  <!-- Key 2011-14: 15,144 -->
  <rect x="218.5" y="144.0" width="78" height="286.0" rx="2" fill="#1f6fb2"/>
  <text x="257.5" y="136.0" text-anchor="middle" font-size="14" font-weight="600" fill="#333">15,144</text>
  <text x="257.5" y="452" text-anchor="middle" font-size="13" fill="#333">Key</text>
  <text x="257.5" y="470" text-anchor="middle" font-size="12" fill="#888">2011&#8211;14</text>

  <!-- Key 2014-17: 14,584 -->
  <rect x="343.5" y="154.5" width="78" height="275.5" rx="2" fill="#1f6fb2"/>
  <text x="382.5" y="146.5" text-anchor="middle" font-size="14" font-weight="600" fill="#333">14,584</text>
  <text x="382.5" y="452" text-anchor="middle" font-size="13" fill="#333">Key</text>
  <text x="382.5" y="470" text-anchor="middle" font-size="12" fill="#888">2014&#8211;17</text>

  <!-- Ardern 2017-20: 17,538 -->
  <rect x="468.5" y="98.7" width="78" height="331.3" rx="2" fill="#cc2b2b"/>
  <text x="507.5" y="90.7" text-anchor="middle" font-size="14" font-weight="600" fill="#333">17,538</text>
  <text x="507.5" y="452" text-anchor="middle" font-size="13" fill="#333">Ardern</text>
  <text x="507.5" y="470" text-anchor="middle" font-size="12" fill="#888">2017&#8211;20</text>

  <!-- Ardern 2020-23: 16,818 -->
  <rect x="593.5" y="112.3" width="78" height="317.7" rx="2" fill="#cc2b2b"/>
  <text x="632.5" y="104.3" text-anchor="middle" font-size="14" font-weight="600" fill="#333">16,818</text>
  <text x="632.5" y="452" text-anchor="middle" font-size="13" fill="#333">Ardern</text>
  <text x="632.5" y="470" text-anchor="middle" font-size="12" fill="#888">2020&#8211;23</text>

  <!-- Luxon 2023-: 12,710 (partial) -->
  <rect x="718.5" y="189.9" width="78" height="240.1" rx="2" fill="#1f6fb2" fill-opacity="0.5"/>
  <text x="757.5" y="181.9" text-anchor="middle" font-size="14" font-weight="600" fill="#333">12,710*</text>
  <text x="757.5" y="452" text-anchor="middle" font-size="13" fill="#333">Luxon</text>
  <text x="757.5" y="470" text-anchor="middle" font-size="12" fill="#888">2023&#8211;26*</text>

  <!-- Footnotes -->
  <text x="70" y="505" font-size="12" fill="#999">* Current term still in progress (data to mid-2026), so the bar is partial.</text>
  <text x="70" y="524" font-size="12" fill="#666"><tspan font-weight="700">Source: whiplash.jonno.nz</tspan><tspan fill="#999">&#160;&#183; from 241,456 changes to NZ's Acts and regulations since 1872; chart shows Acts only</tspan></text>
</svg>
