<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spent, then scrapped</title>
<link rel="canonical" href="https://whiplash.jonno.nz/embed/cost-reversals">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  .chart{
    max-width:720px;margin:0 auto;padding:8px 4px 4px;background:#fff;color:#1a1a1a;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .title{font-size:clamp(19px,4.6vw,22px);font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
  .sub{font-size:14px;color:#666;margin:0 0 20px}
  .plot{display:grid;grid-template-columns:52px 1fr;grid-template-rows:300px auto}
  .yaxis{grid-row:1;grid-column:1;position:relative}
  .ylab{position:absolute;right:8px;transform:translateY(50%);font-size:12px;color:#999;white-space:nowrap}
  .region{grid-row:1;grid-column:2;position:relative}
  .grid{position:absolute;left:0;right:0;border-top:1px solid #ececec}
  .grid.base{border-top-color:#bbb}
  .bars{position:absolute;inset:0;display:flex;align-items:flex-end}
  .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
  .val{margin-bottom:6px;font-weight:700;font-size:15px;color:#222;white-space:nowrap}
  .bar{width:62%;max-width:104px;background:#3a3a3a;border-radius:3px 3px 0 0}
  .xaxis{grid-row:2;grid-column:2;display:flex;padding-top:8px}
  .xcol{flex:1;text-align:center;padding:0 4px;min-width:0}
  .xname{font-size:13px;color:#333;line-height:1.25}
  .xsub{font-size:12px;color:#888;line-height:1.25;margin-top:2px}
  .note{font-size:12px;color:#999;line-height:1.5;margin:18px 2px 0}
  .note a{color:#555}
  .note .src{color:#555;font-weight:700}
</style>
</head>
<body>
<figure class="chart">
  <p class="title">Spent, then scrapped</p>
  <p class="sub">Public money sunk into major projects this government cancelled, $ millions</p>

  <div class="plot">
    <div class="yaxis">
      <span class="ylab" style="bottom:0%">$0</span>
      <span class="ylab" style="bottom:27.397%">$200m</span>
      <span class="ylab" style="bottom:54.795%">$400m</span>
      <span class="ylab" style="bottom:82.192%">$600m</span>
    </div>
    <div class="region">
      <div class="grid base" style="bottom:0%"></div>
      <div class="grid" style="bottom:27.397%"></div>
      <div class="grid" style="bottom:54.795%"></div>
      <div class="grid" style="bottom:82.192%"></div>
      <div class="bars">
        <div class="col"><span class="val">$671m</span><div class="bar" style="height:91.918%"></div></div>
        <div class="col"><span class="val">$228m</span><div class="bar" style="height:31.233%"></div></div>
        <div class="col"><span class="val">$181m</span><div class="bar" style="height:24.795%"></div></div>
      </div>
    </div>
    <div class="xaxis">
      <div class="xcol"><div class="xname">iReX ferries</div><div class="xsub">no ferries delivered</div></div>
      <div class="xcol"><div class="xname">Auckland Light Rail</div><div class="xsub">zero metres of track</div></div>
      <div class="xcol"><div class="xname">Let's Get Wellington Moving</div><div class="xsub">disbanded</div></div>
    </div>
  </div>

  <figcaption class="note">
    Money actually spent (sunk + cancellation), about $1.08b in total. Replacements and &ldquo;would have cost&rdquo; projections excluded.<br>
    <span class="src">Source: <a href="https://whiplash.jonno.nz" target="_blank" rel="noopener">whiplash.jonno.nz</a></span> &middot; every figure linked to its receipt<br>
    Take this chart: <a href="cost-reversals.png" download target="_blank">PNG</a> &middot; <a href="cost-reversals.svg" download target="_blank">SVG</a> &middot; <a href="cost-reversals.csv" download target="_blank">CSV</a> &mdash; free to republish with the source line &middot; <a href="mailto:jonno.nz@gmail.com?subject=Whiplash">jonno.nz@gmail.com</a>
  </figcaption>
</figure>
</body>
</html>
